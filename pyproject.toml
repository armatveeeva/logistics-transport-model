[project]
name = "logistics-transport-model"
version = "0.1.0"
description = ""
authors = [
    {name = "Anastasiia Matveeva",email = "aanmattv@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy (>=2.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "pandas (>=3.1.0,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.3,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "pandas-stubs (>=3.0.5.260914,<4.0.0.0)"
]

[tool.poetry]
packages = [{ include = "logistics_model", from = "src" }]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF", "T20"]
ignore = [
    "E402",
    "RUF001",
    "RUF002",
    "UP038",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=logistics_model"
